name: Probe sites (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/probe.py
      - name: Save results to probe-data branch
        run: |
          mkdir /tmp/pd && cp -r probe_out/* /tmp/pd/
          cd /tmp/pd && git init -q -b probe-data && git add -A
          git -c user.name=probe -c user.email=probe@local commit -qm "probe data"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-data
